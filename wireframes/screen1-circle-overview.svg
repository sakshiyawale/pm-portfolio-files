<svg viewBox="0 0 480 480" width="400" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="480" height="480" rx="16" fill="#f8f9fa"/>
