  <text x="54" y="352" font-size="11.5" fill="#5f6368"><tspan fill="#202124" font-weight="bold">Priya</tspan> added Samsung 28 cu. ft. Refrigerator</text>

  <circle cx="34" cy="378" r="11" fill="#e8f0fe"/>
  <text x="34" y="382" font-size="10" fill="#1a73e8" text-anchor="middle" font-weight="bold">R</text>
  <text x="54" y="382" font-size="11.5" fill="#5f6368"><tspan fill="#202124" font-weight="bold">Rohan</tspan> raised a concern about delivery date</text>

  <circle cx="34" cy="408" r="11" fill="#e8f0fe"/>
  <text x="34" y="412" font-size="10" fill="#1a73e8" text-anchor="middle" font-weight="bold">S</text>
  <text x="54" y="412" font-size="11.5" fill="#5f6368"><tspan fill="#202124" font-weight="bold">Sakshi</tspan> accepted a trade-off on water dispenser</text>
