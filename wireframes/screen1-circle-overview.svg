  <text x="24" y="108" font-size="10" letter-spacing="1" fill="#80868b">ACTIVE WORKSPACES</text>

  <!-- workspace card 1 -->
  <rect x="24" y="118" width="432" height="86" rx="12" fill="#ffffff" stroke="#dadce0" stroke-width="1"/>
