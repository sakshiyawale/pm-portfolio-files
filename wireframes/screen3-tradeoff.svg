<svg viewBox="0 0 380 480" width="320" height="404" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="380" height="480" rx="16" fill="#f1f3f4"/>
  <rect x="20" y="24" width="340" height="436" rx="16" fill="#ffffff" stroke="#dadce0" stroke-width="1"/>

  <text x="44" y="58" font-size="16" fill="#e37400">&#9888;</text>
  <text x="64" y="58" font-size="14" font-weight="bold" fill="#202124">One preference needs your review</text>

  <text x="44" y="86" font-size="11.5" fill="#5f6368">The current leading option does not meet</text>
  <text x="44" y="102" font-size="11.5" fill="#5f6368">your must-have:</text>

  <rect x="44" y="116" width="292" height="30" rx="8" fill="#fce8e6"/>
  <text x="58" y="136" font-size="12" font-weight="bold" fill="#c5221f">External water dispenser</text>

  <text x="44" y="176" font-size="10" letter-spacing="1" fill="#80868b">CHOOSE AN ACTION</text>

  <rect x="44" y="186" width="292" height="34" rx="8" fill="none" stroke="#dadce0"/>
  <text x="60" y="207" font-size="12" fill="#202124">Keep as must-have</text>

  <rect x="44" y="228" width="292" height="34" rx="8" fill="none" stroke="#dadce0"/>
  <text x="60" y="249" font-size="12" fill="#202124">Accept as nice-to-have</text>

  <rect x="44" y="270" width="292" height="34" rx="8" fill="none" stroke="#dadce0"/>
  <text x="60" y="291" font-size="12" fill="#202124">No longer relevant for this purchase</text>

  <rect x="44" y="312" width="292" height="34" rx="8" fill="none" stroke="#dadce0"/>
  <text x="60" y="333" font-size="12" fill="#202124">Suggest another option</text>

  <text x="44" y="368" font-size="10" fill="#80868b">Optional note</text>
  <rect x="44" y="376" width="292" height="28" rx="6" fill="#ffffff" stroke="#dadce0"/>
  <text x="56" y="394" font-size="11" fill="#9aa0a6">Add a short reason</text>

  <rect x="44" y="418" width="292" height="34" rx="17" fill="#1a73e8"/>
  <text x="190" y="440" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">Save decision</text>
</svg>
